[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asoc-ml"
version = "0.1.0"
description = "Machine-learning pipeline for autonomous SOC triage and incident grading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "polars>=1.8.0",
  "pyarrow>=15.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "shap>=0.45.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "joblib>=1.4.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "jupytext>=1.16.0",
  "nbstripout>=0.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
